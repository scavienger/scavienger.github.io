name: Regenerate AI Solution for Post

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Post date (YYYY-MM-DD)'
        required: true
        type: string
      ai_model:
        description: 'AI Model'
        required: true
        type: choice
        options:
          - gemini-2.5-flash
          - llama-3.3-70b-versatile
        default: gemini-2.5-flash
      target_branch:
        description: 'Target branch for the update'
        required: false
        default: 'develop'
        type: string

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Regenerate AI solution
        env:
          AI_MODEL: ${{ inputs.ai_model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Using AI model: $AI_MODEL"
          python scripts/regenerate_solution.py ${{ inputs.date }} ${{ inputs.ai_model }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          git add _posts/
          git commit -m "Regenerate AI solution for ${{ inputs.date }} using ${{ inputs.ai_model }}"
          git push origin ${{ inputs.target_branch }}
