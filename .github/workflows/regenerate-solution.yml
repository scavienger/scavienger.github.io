name: Regenerate AI Solution for Post

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Start/target post date (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'Optional end date for range regeneration (YYYY-MM-DD)'
        required: false
        type: string

concurrency:
  group: leetcode-posts
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Regenerate AI solution(s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then
            echo "Regenerating AI solutions for range: ${{ inputs.date }} to ${{ inputs.end_date }}"
            python scripts/generate_posts.py "${{ inputs.date }}" "${{ inputs.end_date }}"
          else
            echo "Regenerating AI solution for date: ${{ inputs.date }}"
            python scripts/generate_posts.py "${{ inputs.date }}"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add all generated files (posts, cache, snippets)
          git add _posts/ data/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          if [ -n "${{ inputs.end_date }}" ]; then
            git commit -m "Regenerate AI solution(s) for ${{ inputs.date }} to ${{ inputs.end_date }}"
          else
            git commit -m "Regenerate AI solution(s) for ${{ inputs.date }}"
          fi
          git pull --rebase origin master
          git push origin master
