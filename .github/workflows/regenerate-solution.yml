name: Regenerate AI Solution for Post

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Post date (YYYY-MM-DD)'
        required: true
        type: string
      ai_provider:
        description: 'AI Provider'
        required: true
        type: choice
        options:
          - gemini
          - groq
        default: gemini

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Regenerate AI solution
        env:
          AI_PROVIDER: ${{ inputs.ai_provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/regenerate_solution.py ${{ inputs.date }} ${{ inputs.ai_provider }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          git add _posts/
          git commit -m "Regenerate AI solution for ${{ inputs.date }} using ${{ inputs.ai_provider }}"
          git push
