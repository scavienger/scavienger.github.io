name: Regenerate AI Solution for Post

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Post date (YYYY-MM-DD)'
        required: true
        type: string
      ai_models:
        description: 'AI Models (select one or both)'
        required: true
        type: choice
        options:
          - gemini-2.5-flash
          - llama-3.3-70b-versatile
          - Both (gemini + llama)
        default: Both (gemini + llama)

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Determine models to use
        id: models
        run: |
          if [ "${{ inputs.ai_models }}" = "Both (gemini + llama)" ]; then
            echo "models=gemini-2.5-flash llama-3.3-70b-versatile" >> $GITHUB_OUTPUT
          else
            echo "models=${{ inputs.ai_models }}" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate AI solution(s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          MODELS="${{ steps.models.outputs.models }}"
          UPDATE_MODELS=$(echo "$MODELS" | tr ' ' ',')
          echo "Using AI models: $MODELS"
          python scripts/generate_posts.py "${{ inputs.date }}" $MODELS --update-models "$UPDATE_MODELS"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add all generated files (posts, cache, snippets)
          git add _posts/ data/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          git commit -m "Regenerate AI solution(s) for ${{ inputs.date }} using ${{ inputs.ai_models }}"
          git push origin master
