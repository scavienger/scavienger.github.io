name: LeetCode Daily Challenge

on:
  # Run daily at 9:00 AM KST (00:00 UTC)
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger with branch and model selection
  workflow_dispatch:
    inputs:
      ai_model:
        description: 'AI Model'
        required: false
        type: choice
        options:
          - gemini-2.5-flash
          - llama-3.3-70b-versatile
        default: gemini-2.5-flash

  # Run on push to develop (for testing)
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate post with unified generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          MODELS="${{ github.event.inputs.ai_model }}"
          if [ -z "$MODELS" ]; then
            MODELS="gemini-2.5-flash"
          fi
          echo "Generating post for $DATE with models: $MODELS"
          python scripts/generate_posts.py "$DATE" $MODELS

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          git add _posts/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new post to commit (may already exist)"
            exit 0
          fi

          # Extract title from the generated post frontmatter
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")
          DAY=$(date -u +"%d")
          POST_PATH=$(find "_posts/_daily/$YEAR/$MONTH/$DAY" -maxdepth 1 -name "*.md" | head -n 1)
          if [ -z "$POST_PATH" ]; then
            echo "No generated post found for $DATE; aborting commit."
            exit 1
          fi
          TITLE=$(python - "$POST_PATH" <<'PY'
import sys, yaml
from pathlib import Path

path = Path(sys.argv[1])
try:
    text = path.read_text(encoding="utf-8")
    if text.startswith("---"):
        parts = text.split("---", 2)
        if len(parts) > 2:
            meta = yaml.safe_load(parts[1]) or {}
            print(meta.get("title", "LeetCode Daily Challenge"))
            sys.exit(0)
except Exception:
    pass
print("LeetCode Daily Challenge")
PY
)

          git commit -m "Add LeetCode daily challenge: $TITLE ($DATE)"
          git push origin master
