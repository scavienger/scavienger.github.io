name: LeetCode Daily Challenge

on:
  # Run daily at 9:00 AM KST (00:00 UTC)
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger with model selection
  workflow_dispatch:
    inputs:
      ai_model:
        description: 'AI Model'
        required: false
        type: choice
        options:
          - gemini-2.5-flash
          - llama-3.3-70b-versatile
        default: gemini-2.5-flash

  # Run on push to develop (for testing)
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch LeetCode daily question
        id: fetch
        run: |
          python scripts/fetch_leetcode.py > question_data.json
          if [ $? -ne 0 ]; then
            echo "Failed to fetch question"
            exit 1
          fi
          echo "Question data fetched successfully"
          cat question_data.json

      - name: Generate AI solution
        env:
          AI_MODEL: ${{ inputs.ai_model || 'gemini-2.5-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Using AI model: $AI_MODEL"
          python scripts/solve_with_ai.py question_data.json > question_with_solution.json || true
          if [ -f question_with_solution.json ] && [ -s question_with_solution.json ]; then
            echo "AI solution generated successfully"
            mv question_with_solution.json question_data.json
          else
            echo "Warning: Failed to generate AI solution, continuing with basic post"
          fi

      - name: Generate Jekyll post
        run: |
          python scripts/generate_post.py < question_data.json
          if [ $? -ne 0 ]; then
            echo "Failed to generate post"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        run: |
          git add _posts/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new post to commit (may already exist)"
            exit 0
          fi

          # Get the post title from the question data
          TITLE=$(python -c "import json; data=json.load(open('question_data.json')); print(data['title'])")
          DATE=$(date -u +"%Y-%m-%d")

          git commit -m "Add LeetCode daily challenge: $TITLE ($DATE)"
          git push origin master

      - name: Clean up
        if: always()
        run: |
          rm -f question_data.json
