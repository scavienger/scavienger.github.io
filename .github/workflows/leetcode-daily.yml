name: LeetCode Daily Challenge

on:
  # Run daily at 00:00 UTC (midnight UTC) - when LeetCode Daily Challenge resets
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger with branch and model selection
  workflow_dispatch:
    inputs:
      ai_model:
        description: 'AI Model'
        required: false
        type: choice
        options:
          - gemini-2.5-flash
          - llama-3.3-70b-versatile
        default: gemini-2.5-flash

  # Run on push to develop (for testing)
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate post with unified generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          MODELS="${{ github.event.inputs.ai_model }}"
          if [ -z "$MODELS" ]; then
            # Default: generate with both models for daily automation
            MODELS="gemini-2.5-flash llama-3.3-70b-versatile"
          fi
          echo "Generating post for $DATE with models: $MODELS"
          python scripts/generate_posts.py "$DATE" $MODELS

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE=$(date -u +"%Y-%m-%d")

          # Add all generated files (posts, cache, snippets)
          git add _posts/ data/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit (post may already exist)"
            exit 0
          fi

          # Commit changes
          git commit -m "Add LeetCode daily challenge for $DATE"
          git push origin master
