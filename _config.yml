# Site settings
title: LeetCode Daily Challenge
description: Daily LeetCode problems solved automatically
author: scavienger
email: scavienger@gmail.com
baseurl: ""
url: "https://scavienger.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude non-post snippet files under daily posts (language templates)
exclude:
  - "**/*.txt"
  - CLAUDE.md

sass:
  quiet_deps: true
  silence_deprecations:
    - import

# Include future-dated posts (datasets are dated ahead)
future: true

# Syntax highlighting
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true
  parse_block_html: true
# Timezone
timezone: Asia/Seoul

# Permalink structure
permalink: /:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
  daily:
    output: true
    permalink: /:year/:month/:day/:title/
  weekly:
    output: true
    permalink: /:year/:month/:day/:title/

# Collections directory under _posts (use _posts/_daily, _posts/_weekly)
collections_dir: _posts

# Header navigation
header_pages:
  - archive.md
  - difficulties.md
  - tags.md

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "scavienger"
  - scope:
      path: "_posts/_daily"
      type: "daily"
    values:
      layout: "post"
      author: "scavienger"
  - scope:
      path: "_posts/_weekly"
      type: "weekly"
    values:
      layout: "post"
      author: "scavienger"
