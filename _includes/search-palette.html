<div id="search-palette-modal" class="search-palette-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Search challenges" data-search-url="{{ '/search.json' | relative_url }}">
  <div class="search-palette-backdrop" data-search-close></div>
  <div class="search-palette-dialog">
    <div class="search-palette-header">
      <svg class="search-palette-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="search-palette-input"
        class="search-palette-input"
        placeholder="Search by title, topic, difficulty, or YYYY-MM-DD..."
        autocomplete="off"
        spellcheck="false"
      >
      <button type="button" class="search-palette-esc" data-search-close>ESC</button>
    </div>
    <div id="search-palette-results" class="search-palette-results">
      <div class="search-palette-empty">Type to search all daily challenges...</div>
    </div>
    <div class="search-palette-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span><kbd>↵</kbd> Open</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </div>
</div>
